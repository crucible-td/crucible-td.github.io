<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crucible</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <h1>Crucible</h1>
        <div class="readouts">
          <span class="readout"><b id="gold">0</b><small>gold</small></span>
          <span class="readout"><b id="lives">0</b><small>lives</small></span>
          <span class="readout"><b id="wave">0/0</b><small>wave</small></span>
        </div>
      </header>

      <main>
        <canvas id="board" width="960" height="600"></canvas>
        <p id="hint"></p>
      </main>

      <aside id="build">
        <h2>Build</h2>
        <div id="towerList"></div>

        <section id="inspect" hidden>
          <div class="inspectHead">
            <h3 id="inspectTitle"></h3>
            <button id="inspectClose" title="Close">✕</button>
          </div>
          <div id="upgradeList"></div>
        </section>

        <button id="startWave">Start wave</button>

        <div id="speedControls">
          <button id="pause" title="Pause or resume (P)">Pause</button>
          <button id="speed" title="Cycle 1x / 2x / 3x (F)">1&times;</button>
        </div>
        <!-- The resistance table used to live folded up in a <details> at the
             bottom of this panel. It is the entire game, so it is now open,
             and it carries the layer chain alongside it. -->
        <section id="matter">
          <h2>Matter</h2>
          <div id="matterBody"></div>
        </section>
      </aside>
    </div>

    <div id="overlay" hidden>
      <div class="panel">
        <h2 id="overlayTitle"></h2>
        <p id="overlayBody"></p>
        <button id="freeplay">Into freeplay</button>
        <button id="restart">Run it again</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
