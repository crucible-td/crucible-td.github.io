name: Deploy

# Build and publish the game to GitHub Pages, but only when it still passes its
# own measurements. This project's whole premise is that balance is measured
# rather than asserted, so shipping a build whose tests fail would undercut the
# thing it is trying to demonstrate.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue rather than cancel, so a push that follows
# a green build cannot leave the site on the older of the two.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24: the harnesses run .ts files directly and rely on native type
      # stripping, so an older runtime would fail on `npm test`.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Switch Pages on without needing a visit to repository settings.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
