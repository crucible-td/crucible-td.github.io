name: Deploy

# Build and publish the game to GitHub Pages, but only when it still passes its
# own measurements. This project's whole premise is that balance is measured
# rather than asserted, so shipping a build whose tests fail would undercut the
# thing it is trying to demonstrate.
#
# Pull requests run the same typecheck/test/build gate, so a change is verified
# before it merges rather than after -- but only a push to main deploys. A PR
# publishing over the live site would be a worse bug than the one this workflow
# exists to catch, so `configure-pages` and both Pages steps are gated to
# `push` explicitly rather than left to run wherever the artifact happens to be
# harmless.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Two different questions, so two different keys.
#
# A push to main deploys, and two deploys must never race: those share the
# `pages` group and queue rather than cancel, so a push that follows a green
# build cannot leave the site on the older of the two.
#
# A pull request deploys nothing -- every Pages step below is gated to `push`
# -- so it has no reason to serialize against anything but itself. Sharing the
# `pages` group cost real time: GitHub keeps only one *pending* run per group,
# so opening four pull requests at once cancelled two of their checks outright
# and they had to be re-run by hand, one at a time. Each ref now gets its own
# group, and a new push to a branch supersedes the check still running for the
# commit it replaced.
concurrency:
  group: ${{ github.event_name == 'push' && 'pages' || format('checks-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24: the harnesses run .ts files directly and rely on native type
      # stripping, so an older runtime would fail on `npm test`.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5
        if: github.event_name == 'push'
        with:
          # Switch Pages on without needing a visit to repository settings.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
